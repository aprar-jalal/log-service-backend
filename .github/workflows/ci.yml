name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run build

  smoke-test:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Boot stack (AUTH_ENABLED=false)
        run: docker compose up -d --build postgres backend

      - name: Smoke test — unauthenticated core service
        run: ./scripts/smoke-test.sh

      - name: Tear down
        run: docker compose down -v

      - name: Boot stack (AUTH_ENABLED=true)
        env:
          AUTH_ENABLED: "true"
          LOADGEN_API_KEY: "ci-smoke-test-key"
        run: docker compose up -d --build postgres backend

      - name: Smoke test — authenticated configuration
        env:
          AUTH_ENABLED: "true"
          LOADGEN_API_KEY: "ci-smoke-test-key"
        run: ./scripts/smoke-test.sh

      - name: Tear down
        run: docker compose down -v
